[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-report-analyzer"
version = "0.2.0"
description = "Evidence-driven experimental-report analysis and research planning"
requires-python = ">=3.10"
dependencies = [
  "PyMuPDF>=1.24.0",
  "Pillow>=10.0.0",
  "Markdown>=3.7",
  "jsonschema>=4.23"
]

[tool.setuptools]
packages = ["scripts"]
