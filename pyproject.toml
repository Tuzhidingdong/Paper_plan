[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "experiment-report-analyzer"
version = "0.1.0"
description = "Evidence-driven analysis of experimental-report PDFs"
requires-python = ">=3.10"
dependencies = ["PyMuPDF>=1.24.0", "Pillow>=10.0.0"]

[tool.setuptools]
packages = ["scripts"]
